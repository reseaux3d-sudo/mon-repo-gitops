# nginx-ubi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: ghcr.io/reseaux3d-sudo/nginx-demo-repo:37f0eb2253055542dd76c60041b803f8a5a92cb6
        command: ["nginx", "-g", "daemon off;"]   # commande explicite
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
