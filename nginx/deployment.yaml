# nginx-ubi.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: ghcr.io/reseaux3d-sudo/nginx-demo-repo:8a06b5771f5bbdbdc0b1886aefe4e90b4fdfe101
        command: ["nginx", "-g", "daemon off;"]   # commande explicite
        ports:
        - containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
